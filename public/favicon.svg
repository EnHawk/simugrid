<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081320"/>
      <stop offset="50%" stop-color="#041F1A"/>
      <stop offset="100%" stop-color="#020C14"/>
    </linearGradient>

    <linearGradient id="sg_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="sg_energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="28%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="sg_core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <filter id="sg_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sg_bg)" stroke="url(#sg_border)" stroke-width="1.5"/>

  <!-- 4-Quadrant Microgrid Tiles -->
  <g opacity="0.6">
    <rect x="7" y="7" width="14" height="14" rx="4" fill="#0F2C24" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.3"/>
    <rect x="27" y="7" width="14" height="14" rx="4" fill="#082535" stroke="#06B6D4" stroke-width="0.8" stroke-opacity="0.3"/>
    <rect x="7" y="27" width="14" height="14" rx="4" fill="#07241F" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.3"/>
    <rect x="27" y="27" width="14" height="14" rx="4" fill="#111833" stroke="#6366F1" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <!-- Microgrid Bus Circuit Tracks -->
  <path d="M 14 24 H 34 M 24 14 V 34" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="1.5 2"/>

  <!-- 4 Power Node Junction Terminals -->
  <circle cx="14" cy="14" r="1.8" fill="#F59E0B" opacity="0.9"/>
  <circle cx="34" cy="14" r="1.8" fill="#06B6D4" opacity="0.9"/>
  <circle cx="14" cy="34" r="1.8" fill="#10B981" opacity="0.9"/>
  <circle cx="34" cy="34" r="1.8" fill="#6366F1" opacity="0.9"/>

  <!-- The Hero "S" Energy Lightning Conduit -->
  <g filter="url(#sg_glow)">
    <path d="M 33 11.5 C 33 11.5, 23 11.5, 19 11.5 C 15 11.5, 12.5 14, 12.5 17.5 C 12.5 21, 15.5 22.5, 18.5 22.5 L 28.5 22.5 L 18 36.5 L 23.5 27.5 L 15.5 27.5 C 15.5 27.5, 25 27.5, 29 27.5 C 33 27.5, 35.5 30, 35.5 33.5 C 35.5 37, 32.5 37.5, 28.5 37.5 L 15 37.5" 
          fill="none" stroke="url(#sg_energy)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 28 14.5 L 18.5 27.5 L 24 27.5 L 19 34" 
          fill="none" stroke="url(#sg_core)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="23.5" cy="24.5" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>